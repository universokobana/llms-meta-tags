name: CI/CD Pipeline

concurrency:
  group: main-pipeline
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - production

jobs:
  tests:
    name: Run Test Suite
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # - name: Load secrets
      #   uses: 1password/load-secrets-action@v2
      #   with:
      #     export-env: true
      #   env:
      #     OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Run test suite
        id: test-suite
        continue-on-error: true
        run: npm test
      - name: Build
        run: npm run build
      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@v2
        if: steps.test-suite.outcome != 'success'
        with:
          status: ${{ job.status }}
          notify_when: 'failure'
          notification_title: '{workflow} has {status_message}'
          message_format: '{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked Repo <{repo_url}|{repo}>'
          # notify_when: "failure"
          # mention_users: "U0160UUNH8S,U0080UUAA9N"
          # mention_users_when: "failure,warnings"
          # mention_groups: "SAZ94GDB8"
          # mention_groups_when: "failure,warnings"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEV_WEBHOOK }}
      - name: Notify failure if the test suite fails, workaround for continue-on-error
        if: steps.test-suite.outcome != 'success'
        run: exit 1

